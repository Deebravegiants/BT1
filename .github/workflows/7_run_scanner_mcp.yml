name: 7 Run Scanner Automation (MCP)

on:
  workflow_dispatch:  # allows manual trigger from Actions tab
#  push:
#    branches:
#      - main


permissions:
  contents: write
  actions: write

# One run at a time: parallel runs scan the same pending files and share one DeepWiki rate limit.
concurrency:
  group: scanner-mcp
  cancel-in-progress: false

jobs:
  run-deepwiki:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || echo "No requirements.txt found, skipping"

      # Moves a scanned folder into pending only when pending is empty, then scans.
      - name: Run Scanner
        id: scanner
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: python run_scanner_mcp.py

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-debug-${{ github.run_number }}
          path: debug_no_form_*.png
          if-no-files-found: ignore

      - name: Commit and push changes
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Auto-update: collections and reports"

          # Retry logic
          n=0
          until [ $n -ge 3 ]; do
            if git pull --rebase origin main && git push origin main; then
              echo "Push succeeded"
              break
            fi
            git rebase --abort 2>/dev/null || true
            n=$((n+1))
            echo "Push failed, retrying in 5 seconds..."
            sleep 5
          done

          # Fail the step if all retries are exhausted
          if [ $n -eq 3 ]; then
            echo "Failed to push after 3 attempts"
            exit 1
          fi

      - name: Wait out the rate limit
        if: steps.scanner.outputs.more_work == 'true' && steps.scanner.outputs.rate_limited == 'true'
        run: sleep 600

      - name: Trigger next batch
        if: steps.scanner.outputs.more_work == 'true'
        uses: nick-fields/retry@v3
        with:
          max_attempts: 2
          timeout_seconds: 60
          retry_on: 'error'
          retry_wait_seconds: 30
          command: |
            curl -fsS -X POST \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/7_run_scanner_mcp.yml/dispatches \
              -d '{"ref":"main"}'
